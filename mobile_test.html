<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile UI Test</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background: #f0f0f0;
        }
        .mobile-mode {
            background: lightgreen;
        }
        #mobile-right-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 33vw;
            height: 100vh;
            background: #fff;
            border-left: 1px solid rgba(0,0,0,0.08);
            box-shadow: -6px 0 24px rgba(0,0,0,0.06);
            z-index: 150;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }
        .test-result {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="debug-info">
        <div>Screen: <span id="screen-size"></span></div>
        <div>Mobile Mode: <span id="mobile-mode-status"></span></div>
        <div>Panel Exists: <span id="panel-exists"></span></div>
        <div>Panel Visible: <span id="panel-visible"></span></div>
    </div>

    <div id="app">
        <h1>Mobile UI Test</h1>
        <div id="test-results"></div>
        <button onclick="runTests()">Run Tests</button>
        <button onclick="forceCreatePanel()">Force Create Panel</button>
    </div>

    <script>
        // Minimalne funkcje potrzebne do testów
        function computeMobileMode(){
            const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
            const isNarrowScreen = window.innerWidth <= 900;
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const isDevToolsEmulator = isNarrowScreen && (hasTouch || window.orientation !== undefined || navigator.userAgent.includes('Chrome'));
            const isSmallScreen = window.innerWidth <= 768;
            const isMobile = uaMobile || isDevToolsEmulator || isSmallScreen;
            return isMobile;
        }

        function applyMobileMode() { 
            document.body.classList.toggle('mobile-mode', computeMobileMode()); 
        }

        function ensureMobilePanel() {
            console.log('📱 ensureMobilePanel called, mobile-mode:', document.body.classList.contains('mobile-mode'));
            
            if (!document.body.classList.contains('mobile-mode')) {
                console.log('📱 Not in mobile-mode, returning null');
                return null;
            }
            
            let panel = document.getElementById('mobile-right-panel');
            console.log('📱 Found existing panel:', !!panel);
            
            if (!panel) {
                console.log('📱 Creating new mobile panel...');
                const parent = document.getElementById('app') || document.body;
                panel = document.createElement('aside');
                panel.id = 'mobile-right-panel';
                panel.style.cssText = 'position: fixed; top: 0; right: 0; width: 33vw; height: 100vh; background: #fff; border-left: 1px solid rgba(0,0,0,0.08); box-shadow: -6px 0 24px rgba(0,0,0,0.06); z-index: 150; overflow-y: auto; padding: 12px; display: block;';
                parent.appendChild(panel);
                console.log('📱 Mobile panel created successfully');
            }
            
            // Upewnij się, że panel jest widoczny
            panel.style.display = 'block';
            panel.style.visibility = 'visible';
            panel.style.opacity = '1';
            
            return { panel };
        }

        function forceCreatePanel() {
            document.body.classList.add('mobile-mode');
            ensureMobilePanel();
            updateDebugInfo();
        }

        function updateDebugInfo() {
            document.getElementById('screen-size').textContent = `${window.innerWidth}x${window.innerHeight}`;
            document.getElementById('mobile-mode-status').textContent = document.body.classList.contains('mobile-mode') ? 'YES' : 'NO';
            
            const panel = document.getElementById('mobile-right-panel');
            document.getElementById('panel-exists').textContent = panel ? 'YES' : 'NO';
            document.getElementById('panel-visible').textContent = panel && panel.style.display !== 'none' ? 'YES' : 'NO';
        }

        function runTests() {
            const results = document.getElementById('test-results');
            results.innerHTML = '';

            // Test 1: Mobile detection
            applyMobileMode();
            const isMobile = document.body.classList.contains('mobile-mode');
            addTestResult(`Mobile Detection: ${isMobile ? 'PASS' : 'FAIL'}`, isMobile);

            // Test 2: Panel creation (only if mobile)
            if (isMobile) {
                const ctx = ensureMobilePanel();
                const panelCreated = ctx && ctx.panel;
                addTestResult(`Panel Creation: ${panelCreated ? 'PASS' : 'FAIL'}`, panelCreated);

                // Test 3: Panel visibility
                const panel = document.getElementById('mobile-right-panel');
                const panelVisible = panel && panel.style.display !== 'none';
                addTestResult(`Panel Visibility: ${panelVisible ? 'PASS' : 'FAIL'}`, panelVisible);
            } else {
                addTestResult('Skipped panel tests (not mobile)', true);
            }

            updateDebugInfo();
        }

        function addTestResult(text, success) {
            const div = document.createElement('div');
            div.className = `test-result ${success ? 'success' : 'error'}`;
            div.textContent = text;
            document.getElementById('test-results').appendChild(div);
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            runTests();
            setInterval(updateDebugInfo, 1000);
        });

        window.addEventListener('resize', () => {
            applyMobileMode();
            updateDebugInfo();
        });
    </script>
</body>
</html>

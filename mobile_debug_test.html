<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Categories Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        .debug-panel {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .mobile-panel-mock {
            width: 300px;
            height: 500px;
            border: 2px solid #333;
            background: white;
            padding: 12px;
            margin: 20px 0;
            overflow-y: auto;
        }
        .category-button {
            padding: 8px 16px;
            border: 2px solid #F5C842;
            background: white;
            color: #333;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
            margin: 4px;
            display: inline-block;
        }
        .category-button:hover {
            background: #F5C842;
            color: #333;
        }
        .category-button.active {
            background: #F5C842;
            color: #333;
        }
        .promotion {
            border-color: #FF6B6B !important;
            color: #FF6B6B !important;
        }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 200px;
        }
    </style>
</head>
<body>
    <h1>Mobile Categories Debug Test</h1>
    
    <div class="debug-panel">
        <h3>Mock Data Test</h3>
        <button onclick="testWithMockData()">Test with Mock Data</button>
        <button onclick="testEmptyData()">Test with Empty Data</button>
        <button onclick="clearTest()">Clear Test</button>
    </div>
    
    <div class="debug-panel">
        <h3>Console Output:</h3>
        <pre id="console-output"></pre>
    </div>
    
    <div class="debug-panel">
        <h3>Mobile Panel Mock:</h3>
        <div class="mobile-panel-mock" id="mobile-panel-mock">
            <div id="special-categories-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;"></div>
            <div id="category-buttons-container" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
        </div>
    </div>

    <script>
        let allData = [];
        
        // Mock console.log to display in our debug panel
        const originalLog = console.log;
        const consoleOutput = document.getElementById('console-output');
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            consoleOutput.textContent += message + '\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        function clearConsole() {
            consoleOutput.textContent = '';
        }
        
        function clearTest() {
            clearConsole();
            document.getElementById('special-categories-container').innerHTML = '';
            document.getElementById('category-buttons-container').innerHTML = '';
        }
        
        function testWithMockData() {
            clearTest();
            console.log('🧪 Testing with mock data...');
            
            // Mock data that should work
            allData = [
                { Nazwa: 'Krzesło A', Kategoria: 'Krzesła biurowe', Typ: 'model', Promocja: 'TRUE', Procent: '20' },
                { Nazwa: 'Krzesło B', Kategoria: 'Krzesła jadalne', Typ: 'model', Bestseller: 'TRUE' },
                { Nazwa: 'Fotel C', Kategoria: 'Fotele', Grupa: 'krzesło' },
                { Nazwa: 'Hoker D', Kategoria: 'Hokery', Grupa: 'kubełek' },
                { Nazwa: 'Krzesło E', Kategoria: 'Krzesła biurowe, Krzesła ergonomiczne', Typ: 'model' }
            ];
            
            console.log('Mock allData:', allData);
            
            // Test category rendering logic
            testCategoryRendering();
        }
        
        function testEmptyData() {
            clearTest();
            console.log('🧪 Testing with empty data...');
            
            allData = [];
            console.log('Empty allData:', allData);
            
            testCategoryRendering();
        }
        
        function testCategoryRendering() {
            console.log('🎯 Starting category rendering test...');
            
            const specialContainer = document.getElementById('special-categories-container');
            const container = document.getElementById('category-buttons-container');
            
            if (!specialContainer || !container) {
                console.error('❌ Containers not found!');
                return;
            }
            
            // Clear containers
            specialContainer.innerHTML = '';
            container.innerHTML = '';
            
            // Test logic from renderCategoriesContent
            console.log('🔍 DEBUG - Sample allData items:');
            console.log('First 3 items:', allData.slice(0, 3));
            console.log('All item.Kategoria values:', allData.map(item => item.Kategoria));
            console.log('All item.Typ values:', allData.map(item => item.Typ));
            console.log('All item.Grupa values:', allData.map(item => item.Grupa));
            
            // Test flexible filtering
            let itemsForCategories = allData.filter(item => {
                if (!item.Kategoria) return false;
                
                const isModel = item.Typ === 'model' || 
                               item.Grupa === 'krzesło' || 
                               item.Grupa === 'kubełek' ||
                               item.Grupa?.toLowerCase() === 'krzesło' ||
                               item.Grupa?.toLowerCase() === 'kubełek' ||
                               item.Typ?.toLowerCase() === 'model';
                
                return isModel;
            });
            
            console.log('🔍 Items for categories (flexible):', itemsForCategories.length);
            
            if (itemsForCategories.length === 0) {
                console.warn('⚠️ No items found with standard filters, trying more flexible approach...');
                itemsForCategories = allData.filter(item => item.Kategoria && item.Kategoria.trim() !== '');
                console.log('🔍 Items with any Kategoria:', itemsForCategories.length);
            }
            
            const categories = [...new Set(itemsForCategories
                .map(item => item.Kategoria)
                .flatMap(kategoria => kategoria.split(',').map(k => k.trim()))
            )].filter(cat => cat && cat !== '');
            
            console.log('Found categories:', categories);
            
            // Add emergency categories if none found
            if (categories.length === 0) {
                console.warn('⚠️ No categories found, adding default categories');
                categories.push('Krzesła', 'Fotele', 'Hokery');
                console.log('🔧 Added emergency default categories');
            }
            
            // Create "Wszystkie" button
            console.log('🎯 Creating special category buttons...');
            const allButton = document.createElement('button');
            allButton.className = 'category-button special-category';
            allButton.textContent = 'Wszystkie';
            allButton.onclick = () => {
                console.log('Clicked: Wszystkie');
                document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active'));
                allButton.classList.add('active');
            };
            specialContainer.appendChild(allButton);
            console.log('✅ Added "Wszystkie" button');
            
            // Test promotion detection
            const promotionalModels = allData.filter(item => {
                const isModel = item.Typ === 'model' || item.Grupa === 'krzesło' || item.Grupa === 'kubełek';
                const hasPromotion = item.Promocja === 'TRUE' || item.Promocja === 'true';
                const hasPercent = item.Procent && parseFloat(item.Procent) > 0;
                return isModel && hasPromotion && hasPercent;
            });
            
            console.log('🔥 Promotional models found:', promotionalModels.length);
            
            if (promotionalModels.length > 0) {
                const promoButton = document.createElement('button');
                promoButton.className = 'category-button promotion special-category';
                promoButton.textContent = '🔥 Promocje';
                promoButton.onclick = () => {
                    console.log('Clicked: Promocje');
                    document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active'));
                    promoButton.classList.add('active');
                };
                specialContainer.appendChild(promoButton);
                console.log('✅ Added "Promocje" button');
            }
            
            // Test bestseller detection
            const bestsellerModels = allData.filter(item => {
                const isModel = item.Typ === 'model' || item.Grupa === 'krzesło' || item.Grupa === 'kubełek';
                const isBestseller = item.Bestseller === 'TRUE' || item.Bestseller === 'true';
                return isModel && isBestseller;
            });
            
            console.log('⭐ Bestseller models found:', bestsellerModels.length);
            
            if (bestsellerModels.length > 0) {
                const bestButton = document.createElement('button');
                bestButton.className = 'category-button bestseller special-category';
                bestButton.textContent = '⭐ Bestsellery';
                bestButton.onclick = () => {
                    console.log('Clicked: Bestsellery');
                    document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active'));
                    bestButton.classList.add('active');
                };
                specialContainer.appendChild(bestButton);
                console.log('✅ Added "Bestsellery" button');
            }
            
            // Create category buttons
            console.log('🎯 Creating main category buttons for', categories.length, 'categories:', categories);
            categories.forEach((category, index) => {
                console.log(`🎯 Creating button ${index + 1}/${categories.length} for category:`, category);
                
                const button = document.createElement('button');
                button.className = 'category-button';
                button.textContent = category;
                button.onclick = () => {
                    console.log('Clicked category:', category);
                    document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                };
                
                container.appendChild(button);
                console.log(`✅ Added category button: "${category}"`);
            });
            
            console.log('🎯 Final summary:');
            console.log('  - Special buttons created:', specialContainer.children.length);
            console.log('  - Category buttons created:', container.children.length);
            console.log('  - Total categories processed:', categories.length);
        }
    </script>
</body>
</html>
